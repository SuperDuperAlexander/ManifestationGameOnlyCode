<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4eedf" />
    <title>Villager Kit Preview</title>
    <style>
      :root { color-scheme: light; font-family: Georgia, 'Times New Roman', serif; color: #4e5566; background: #f4eedf; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      main { width: min(1120px, 100%); margin: 0 auto; padding: 24px clamp(16px, 4vw, 44px) 32px; }
      header { margin-bottom: 18px; }
      h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2.2rem); font-weight: 500; }
      header p { margin: 6px 0 0; line-height: 1.5; }
      .stage { position: relative; height: min(58vh, 520px); min-height: 340px; overflow: hidden; border: 1px solid #d9d0bd; border-radius: 18px; background: #e9dfc9; box-shadow: 0 12px 30px #4e55661a; }
      canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
      .labels { position: absolute; top: 14px; left: 0; right: 0; display: grid; grid-template-columns: 1fr 1fr; text-align: center; pointer-events: none; }
      .labels span { justify-self: center; padding: 7px 14px; border-radius: 999px; background: #f4eedfdd; font: 600 0.9rem/1.2 system-ui, sans-serif; letter-spacing: 0.04em; }
      .controls { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; padding: 18px 0 0; }
      fieldset { min-width: 0; margin: 0; padding: 12px 14px 14px; border: 1px solid #d9d0bd; border-radius: 12px; }
      legend, label { font: 600 0.9rem/1.4 system-ui, sans-serif; }
      select, button { min-height: 42px; border: 1px solid #9d937f; border-radius: 8px; color: inherit; background: #fffdf7; font: 0.95rem system-ui, sans-serif; }
      select { width: 100%; margin-top: 8px; padding: 0 10px; }
      button { width: 100%; margin-top: 8px; padding: 8px 12px; cursor: pointer; }
      button:hover, select:hover { background: white; }
      .colors { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
      .color-field { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      input[type="color"] { width: 42px; height: 34px; padding: 2px; border: 1px solid #b7ad9b; border-radius: 6px; background: #fffdf7; }
      .help { margin: 13px 2px 0; font: 0.85rem/1.5 system-ui, sans-serif; }
      @media (max-width: 700px) { main { padding-top: 16px; } .stage { height: 48vh; min-height: 300px; } .controls { grid-template-columns: 1fr 1fr; } .colors { grid-column: 1 / -1; } }
      @media (max-width: 430px) { .controls { grid-template-columns: 1fr; } .stage { min-height: 280px; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Villager kit</h1>
        <p>One live game figure. Two moods. Drag to look around. Use the wheel to zoom.</p>
      </header>
      <section class="stage" aria-label="3D villager preview">
        <canvas id="villagers" aria-label="Peaceful and angry villagers. Use the mouse to orbit and zoom."></canvas>
        <div class="labels" aria-hidden="true"><span id="left-label">Peaceful</span><span id="right-label">Angry</span></div>
      </section>
      <section class="controls" aria-label="Villager preview controls">
        <fieldset>
          <legend>Resident</legend>
          <label for="gender">Choose a resident</label>
          <select id="gender">
            <option value="female">Woman</option><option value="male">Man</option>
          </select>
        </fieldset>
        <fieldset>
          <legend>Shared colour set</legend>
          <label for="palette">Choose a colour set</label>
          <select id="palette">
            <option value="earthy">Earthy</option><option value="muted">Muted</option><option value="deep">Deep</option>
            <option value="market">Market</option><option value="dusk">Dusk</option><option value="clay">Clay</option>
          </select>
        </fieldset>
        <fieldset>
          <legend>Figure states</legend>
          <button id="swap" type="button" aria-pressed="false">Swap peaceful and angry</button>
        </fieldset>
        <fieldset class="colors">
          <legend>Custom colours</legend>
          <div class="colors">
            <label class="color-field" for="tunic">Tunic <input id="tunic" type="color" value="#7d7f5a" /></label>
            <label class="color-field" for="scarf">Scarf <input id="scarf" type="color" value="#da7a4a" /></label>
            <label class="color-field" for="hair">Hair <input id="hair" type="color" value="#6b5142" /></label>
            <label class="color-field" for="skin">Skin <input id="skin" type="color" value="#e6b891" /></label>
          </div>
        </fieldset>
      </section>
      <p class="help">Anger raises the torch and makes steam. The game keeps a lit torch burning gently after anger fades.</p>
    </main>
    <script type="module" src="/villager-kit/src/demo.ts"></script>
  </body>
</html>
